<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Basta! Contra o Bullying</title>
<link rel="stylesheet" href="login.css">
<link rel="icon" type="image/jpg" href="../photos.png"

</head>
<body>

  <div class="login-card">
    <div class="login-brand">
      <div class="mark">B!</div>
      <div class="title">Basta! Contra o Bullying</div>
      <div class="subtitle">Movimento de conscientização e apoio</div>
    </div>

    <h1 class="login-heading">Bem-vindo de volta</h1>
    <p class="login-sub">Entre para acompanhar denúncias e acessar materiais de apoio.</p>

    <form>
      <div class="field">
        <label for="email">E-mail</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox">
          Lembrar de mim
        </label>
        <a href="#" class="forgot-link">Esqueci minha senha</a>
      </div>

      <button type="submit" class="glossy-btn">Entrar</button>
    </form>

    <div class="divider">ou</div>

    <p class="signup-line">Ainda não tem conta? <a href="../pagina6/signup.html">Cadastre-se</a></p>

    <a href="../pagina1/Index.html" class="back-home">← Voltar para o início</a>
  </div>

</body>
</html>
